<p-table
  [value]="users"
  styleClass="p-datatable-striped"
  [paginator]="true"
  [rows]="5"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} usuários"
  [rowsPerPageOptions]="[5, 10, 20]">

  <ng-template pTemplate="caption">
    <div class="flex justify-content-between align-items-center">
      <h2 class="text-xl font-bold text-gray-800">Gerenciamento de Usuários</h2>
      <p-button label="Criar Novo Usuário" icon="pi pi-plus" />
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>Email</th>
      <th>Papéis</th>
      <th style="width: 8rem">Ações</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.public_id }}</td>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>
        @for (role of user.roles; track role.id) {
          <p-tag
            [value]="role.name"
            [severity]="getRoleSeverity(role.name)"
            styleClass="mr-1">
          </p-tag>
        }
      </td>
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pencil" styleClass="p-button-text p-button-rounded" (click)="editUser(user.public_id)" pTooltip="Editar Usuário" tooltipPosition="top" />
          <p-button icon="pi pi-trash" styleClass="p-button-text p-button-rounded p-button-danger" (click)="deleteUser(user.public_id)" pTooltip="Excluir Usuário" tooltipPosition="top" />
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="5" class="text-center p-4">Nenhum usuário encontrado.</td>
    </tr>
  </ng-template>
</p-table>
